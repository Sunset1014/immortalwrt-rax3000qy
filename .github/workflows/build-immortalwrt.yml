#
# Build ImmortalWrt (master) for CMCC RAX3000Q / RAX3000QY
#
# Based on the community Actions-OpenWrt pattern (P3TERX / kkstone),
# rebuilt for ImmortalWrt master with:
#   - qualcommax/ipq50xx cmcc_rax3000q device support (upstream since 2026-07)
#   - WiFi (ath11k) enabled via a device-tree patch with per-device
#     calibration data read from the ART partition (NVMEM) and
#     vendor board data shipped as an ipq-wifi board file
#   - a lean package set tuned for the device's 256 MiB RAM
#

name: Build ImmortalWrt RAX3000QY

on:
  repository_dispatch:
    types: [build]
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Upload firmware to Release'
        required: false
        default: 'true'
        type: boolean

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout build recipe
      uses: actions/checkout@main

    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/.ghcup \
          /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
          /usr/lib/jvm /usr/share/swift /opt/microsoft /etc/mysql /etc/php
        sudo -E apt-get -y purge azure-cli ghc* zulu* llvm* php* mongodb* dotnet-* moby-engine mysql* libgl1-mesa-dri
        sudo -E apt-get -y autoremove --purge
        sudo -E apt-get clean
        sudo journalctl --rotate --vacuum-size=10M
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        df -hT

    - name: Install build dependencies
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -y install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
          g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
          libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev \
          libpython3-dev libreadline-dev libssl-dev libtool llvm lrzsz mkisofs msmtp nano ninja-build p7zip \
          p7zip-full patch pkgconf python3 python3-ply python3-pip python3-pyelftools python3-setuptools \
          qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs unzip vim wget \
          xxd zlib1g-dev file
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean

    - name: Clone ImmortalWrt source
      working-directory: ${{ github.workspace }}
      run: |
        df -hT $PWD
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        echo "SOURCE_HEAD=$(git -C openwrt rev-parse --short HEAD)" >> $GITHUB_ENV

    - name: Enable build ccache
      uses: klever1988/cachewrtbuild@main
      with:
        ccache: 'true'
        mixkey: 'immortalwrt-master-qualcommax-ipq50xx-rax3000qy'
        prefix: ${{ github.workspace }}/openwrt

    - name: Load custom feeds (diy-part1)
      run: |
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update & install feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Apply device patches & board data (diy-part2)
      run: |
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Load custom configuration
      run: |
        [ -d files ] && cp -r files openwrt/files
        [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
        cd openwrt
        make defconfig
        grep -E "^CONFIG_TARGET|^CONFIG_PACKAGE_(luci|homeproxy|wpad|zram|ath11k|ipq-wifi|kmod-tcp-bbr)" .config || true

    - name: Download packages
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 V=s
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Check disk usage
      if: (!cancelled())
      run: df -hT

    - name: Organize firmware files
      id: organize
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware artifact
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: ImmortalWrt${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: steps.organize.outputs.status == 'success' && !cancelled() && github.event.inputs.upload_release != 'false'
      run: |
        echo "release_tag=RAX3000QY-${SOURCE_HEAD}${FILE_DATE}" >> $GITHUB_OUTPUT
        {
          echo "ImmortalWrt master ($SOURCE_HEAD) for CMCC RAX3000Q / RAX3000QY"
          echo ""
          echo "- WiFi (2.4G IPQ5018 + 5G QCN6102) enabled via device-tree patch"
          echo "- Calibration data: per-device from ART partition (NVMEM)"
          echo "- Board data: vendor BDF (bdwlan.b24 / bdwlan.b60) via ipq-wifi-cmcc_rax3000q"
          echo "- Packages: LuCI, homeproxy, SQM, UPnP, zram-swap, BBR"
        } > release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success' && !cancelled() && github.event.inputs.upload_release != 'false'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Delete old workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 7
        keep_minimum_runs: 3

    - name: Remove old releases
      uses: dev-drprasad/delete-older-releases@v0.3.0
      if: steps.tag.outputs.status == 'success' && !cancelled()
      with:
        keep_latest: 5
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
