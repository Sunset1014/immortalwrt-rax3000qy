# Low-memory guardrails for the 256 MiB IPQ5000 (CMCC RAX3000QY)
# NOTE: vm.min_free_kbytes (16 MiB watermark) is already set automatically
# by OpenWrt's sysctl init for >128 MiB systems — do not override here.

# Cap the connection-tracking table: ~5 MiB worst case instead of ~21 MiB
# at the 65536 default. Plenty for home use with a proxy (sing-box
# terminates its own connections, so conntrack only sees local flows).
net.netfilter.nf_conntrack_max=16384

# zram-friendly reclaim: swap cold pages earlier (zram compresses ~2-3:1,
# effectively multiplying usable RAM); read-ahead of swap is useless on zram
vm.swappiness=120
vm.page-cluster=0
